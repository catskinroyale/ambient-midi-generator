name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Start the GUI, check it is still running after a few seconds, and take
      # a screenshot so the window can be checked by eye.
      - name: Smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item target/release/midigen.exe smoke/
          Copy-Item -Recurse soundfonts smoke/
          $p = Start-Process smoke/midigen.exe -PassThru -RedirectStandardError smoke/stderr.txt
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke/screenshot.png")
          Get-Content smoke/stderr.txt -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Error "midigen.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Host "midigen.exe ran for 15 seconds"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke/screenshot.png
            smoke/stderr.txt

      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $dir = "Ambient-MIDI-Generator-$v-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/midigen.exe "$dir/Ambient MIDI Generator.exe"
          Copy-Item -Recurse soundfonts $dir/
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ZIP=$dir.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} ${{ env.ZIP }} --clobber

    permissions:
      contents: write
