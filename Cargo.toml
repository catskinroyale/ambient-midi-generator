[package]
name = "midigen"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/catskinroyale/ambient-midi-generator"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
hound = "3.5.1"
midly = "0.5.3"
rfd = "0.17.2"
rustysynth = "1.3.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

# The native macOS app menu (About, Check for Updates…).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

# The synth runs in real time, so keep debug builds reasonably fast too.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[dev-dependencies]
png = "0.18"
